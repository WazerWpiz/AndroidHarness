name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same setup as the repo's own nightly "Debug build" workflow, which
      # is proven on this repo: JDK 21, the preinstalled Android SDK on the
      # runner, the pinned NDK and the Vulkan shader compiler. The previous
      # version used android-actions/setup-android@v3 here and failed at
      # "Set up Android SDK", so do not bring that action back.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run evolve unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.androidharness.app.evolve.*" --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
