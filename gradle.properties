# CodeQL autobuilds every variant, and its Kotlin extractor runs inside the
# compile daemon: one pass over this ~146k-line module took 4g down with
# "GC overhead limit exceeded". Gradle itself is fine on 4g (that builds the
# release APK), so the extra room goes only to the daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official

# AGP 9.3.1: Compose 1.12.0 libraries require compileSdk 37, but Google has not
# published an API 37 platform (404 + absent from SDK index); compileSdk stays 36.
# This only skips the AAR metadata version check; compile still fails if API-37
# symbols are actually referenced.
android.experimental.disableCompileSdkChecks=true
